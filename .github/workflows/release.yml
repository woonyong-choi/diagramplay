name: release

# v* 태그를 올리면 ci와 같은 검사(check 작업) 뒤 npm에 배포하고 GitHub Release를 만든다. 사전 조건: 저장소 secret NPM_TOKEN(대상 패키지에 쓰기 권한과 bypass 2FA를 가진 granular access token).
on:
  push:
    tags: ['v*']

# 기본은 읽기만 한다. 쓰기 권한은 그 권한이 필요한 작업에만 준다.
permissions:
  contents: read

jobs:
  # ci.yml의 test 작업과 같은 검사 목록이다. 하나를 바꾸면 다른 쪽도 같이 바꾼다(tooling 시험이 두 목록을 비교한다).
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run check:docs
      - run: npm run check:sources
      - run: npm run check:figures
      - if: matrix.node == 22
        run: npm run test:browser
      - name: Check installed npm package
        run: npm run check:package -- "$RUNNER_TEMP/diagramplay-package"

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub Release 생성
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package.json version v$version. Fix one of them and tag again."
            exit 1
          fi
      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is not set. Add a granular access token with package write permission and bypass 2FA under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
      # 디자인 패키지를 배포물에 묶으므로(bundleDependencies) 실행 의존성만 잠금 파일대로 설치한다. 설치 스크립트와 선택 의존성(esbuild 바이너리)은 쓰지 않는다.
      - run: npm ci --ignore-scripts --omit=dev --omit=optional
      # 묶은 디자인이 빠진 배포물을 올리지 않는다. prepack이 디자인의 빌드 전용 esbuild를 치운 목록을 본다.
      - name: Check the bundled design
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "const [p] = require(process.argv[1]); if (!p.bundled.includes('@woonyong-choi/design-tokens') || p.bundled.some((n) => n.includes('esbuild'))) { console.error('::error::bundled: ' + p.bundled.join(', ')); process.exit(1); }" "$RUNNER_TEMP/pack.json"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ;;
          esac
