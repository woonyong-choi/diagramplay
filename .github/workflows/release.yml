name: release

# v* 태그를 올리면 테스트 뒤 npm에 배포하고 GitHub Release를 만든다. 사전 조건: 저장소 secret NPM_TOKEN(대상 패키지에 쓰기 권한과 bypass 2FA를 가진 granular access token).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release 생성
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package.json version v$version. Fix one of them and tag again."
            exit 1
          fi
      - name: Check NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is not set. Add a granular access token with package write permission and bypass 2FA under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:sources
      - run: npm run check:figures
      - name: Check installed npm package
        run: npm run check:package -- "$RUNNER_TEMP/diagramplay-package"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ;;
          esac
